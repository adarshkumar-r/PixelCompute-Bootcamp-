
<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Wordle Game</title>
    <link rel="stylesheet" href="styleWordle.css">
</head>

<body>
    <div class="game-container">

        <h1>Wordle Game</h1>
        <div id="board" class="board"></div>

        <div class="controls">
            <input type="text" id="guess-input" maxlength="5" placeholder="Enter a word">
            <button id="submit-button">Submit Guess</button>
        </div>

        <p id="feedback"></p>
    </div>    
    
    
        
    <script src="scriptWordle.js"></script>
</body>
</html>
